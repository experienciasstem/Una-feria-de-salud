<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portal de noticias · Salud</title>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, div, span, p, a, button, h1, h2, h3, time, * {
      font-family: 'Archivo', sans-serif !important;
      text-decoration: none !important;
    }
    html, body {
      height: 100% !important;
      background: #FFFFFF !important;
      color: #1A1A1A !important;
      overflow: hidden !important;
    }
    body { display: flex !important; flex-direction: column !important; }

    /* ── Barra superior ── */
    .bar {
      background: #0C2340 !important;
      padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .bar-lbl {
      font-size: 14px !important; font-weight: 700 !important;
      letter-spacing: .08em; text-transform: uppercase;
      color: #FFFFFF !important;
    }
    .bar-count {
      font-size: 13px !important; font-weight: 600 !important;
      color: #FFFFFF !important;
      font-variant-numeric: tabular-nums;
    }

    /* ── Consigna ── */
    .consigna {
      padding: 14px 20px 12px;
      font-size: 17px !important; font-weight: 500 !important;
      line-height: 1.4 !important;
      color: #1A1A1A !important;
      flex-shrink: 0;
      max-width: 900px;
    }

    /* ── Carrusel ── */
    .carousel-wrap {
      flex: 1 !important; display: flex !important;
      align-items: stretch; gap: 10px;
      padding: 0 12px 6px;
      min-height: 0;
    }
    .arrow {
      align-self: center;
      width: 40px; height: 40px; border-radius: 50%;
      background: #0C2340 !important; color: #FFFFFF !important;
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .15s, opacity .15s;
    }
    .arrow svg { width: 18px; height: 18px; stroke: #FFFFFF; }
    .arrow:hover:not(:disabled) { background: #1A3A5C !important; }
    .arrow:disabled { opacity: .2; cursor: default; }
    .arrow:focus-visible { outline: 3px solid #7FA7D9; outline-offset: 2px; }

    .viewport { flex: 1; overflow: hidden; min-width: 0; padding: 4px 2px; box-sizing: border-box; }
    .track {
      display: flex; gap: 16px; height: 100%;
      transition: transform .35s ease;
    }

    /* ── Tarjeta ── */
    .card {
      flex-shrink: 0;
      background: #FFFFFF !important;
      border: 1px solid #DCDCDC;
      border-top: 4px solid var(--cat);
      border-radius: 8px;
      padding: 18px 20px 18px;
      display: flex; flex-direction: column; gap: 12px;
      min-height: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .card-meta {
      display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid #EBEBEB;
    }
    .card-medio {
      font-size: 13px !important; font-weight: 700 !important;
      color: #0C2340 !important;
      letter-spacing: .02em;
    }
    .card-fecha {
      font-size: 12px !important; font-weight: 400 !important;
      color: #666666 !important;
      white-space: nowrap;
    }
    .card-cat {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 11px !important; font-weight: 700 !important;
      text-transform: uppercase; letter-spacing: .08em;
      color: #4A4A4A !important;
    }
    .card-cat::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%;
      background: var(--cat); flex-shrink: 0;
    }
    .card-titular {
      font-size: 20px !important; font-weight: 700 !important;
      line-height: 1.28 !important;
      color: #111111 !important;
    }
    .card-bajada {
      font-size: 15px !important; font-weight: 400 !important;
      line-height: 1.55 !important;
      color: #444444 !important;
      flex: 1;
      overflow: auto;
    }
    .card-link {
      align-self: flex-start;
      display: inline-flex; align-items: center; gap: 8px;
      background: #0C2340 !important; color: #FFFFFF !important;
      font-size: 14px !important; font-weight: 700 !important;
      padding: 10px 18px; border-radius: 6px;
      transition: background .15s;
    }
    .card-link svg { width: 14px; height: 14px; stroke: #FFFFFF; }
    .card-link:hover { background: #1A3A5C !important; }
    .card-link:focus-visible { outline: 3px solid #7FA7D9; outline-offset: 2px; }

    /* ── Indicador de avance ── */
    .progress {
      flex-shrink: 0;
      display: flex; justify-content: center; gap: 6px;
      padding: 8px 0 14px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #D0D0D0 !important;
      border: none; cursor: pointer;
      transition: background .15s, width .15s;
    }
    .dot.on { background: #0C2340 !important; width: 22px; border-radius: 4px; }

    @media (max-width: 600px) {
      .consigna { font-size: 15px !important; padding: 12px 16px 10px; }
      .card-titular { font-size: 18px !important; }
      .arrow { width: 34px; height: 34px; }
      .carousel-wrap { gap: 6px; padding: 0 8px 6px; }
    }
  </style>
</head>
<body>

<div class="bar">
  <span class="bar-lbl">Portal de noticias</span>
  <span class="bar-count" id="count" aria-live="polite">1 de 8</span>
</div>

<p class="consigna">Recorré los titulares y sus bajadas. Elegí la noticia que más te interese y abrila para conocer más sobre el tema.</p>

<div class="carousel-wrap">
  <button class="arrow" id="prev" aria-label="Noticia anterior" onclick="move(-1)">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>

  <div class="viewport" id="viewport">
    <div class="track" id="track"></div>
  </div>

  <button class="arrow" id="next" aria-label="Noticia siguiente" onclick="move(1)">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>

<div class="progress" id="progress"></div>

<script>
  const noticias = [
    {
      cat: 'Residuos y ambiente', color: '#8A6D3B', medio: 'La Nación', fecha: '3 may. 2026',
      titular: 'Contenedores colapsados: el desborde de basura ya es parte del paisaje en los cinco barrios porteños con más reclamos',
      bajada: 'La acumulación de residuos genera reclamos en distintos barrios de la Ciudad. La nota muestra dónde se concentra el problema y cómo afecta el espacio cotidiano de quienes viven y circulan por esas zonas.',
      url: 'https://www.lanacion.com.ar/sociedad/contenedores-colapsados-el-desborde-de-basura-ya-es-parte-del-paisaje-en-los-cinco-barrios-portenos-nid03052026/'
    },
    {
      cat: 'Contaminación y descanso', color: '#5B5F97', medio: 'Infobae', fecha: '18 abr. 2026',
      titular: 'Cómo la contaminación lumínica y sonora impactan en la calidad del sueño y la salud de las personas',
      bajada: 'El ruido y la iluminación nocturna forman parte de la vida en las grandes ciudades. Distintos estudios analizan cómo la exposición a estos estímulos puede alterar el descanso y afectar la salud.',
      url: 'https://www.infobae.com/salud/2026/04/18/como-la-contaminacion-luminica-y-sonora-impactan-en-la-calidad-del-sueno-y-la-salud-de-las-personas/'
    },
    {
      cat: 'Trabajo y descanso', color: '#6B7A8F', medio: 'El País', fecha: '10 feb. 2025',
      titular: 'Turnos, sedentarismo, hiperconexión, estrés: cómo el trabajo nos roba el sueño',
      bajada: 'Los horarios laborales, el estrés, el uso constante de dispositivos y algunas formas de trabajo pueden dificultar el descanso. La nota analiza la relación entre la vida laboral, el sueño y la salud.',
      url: 'https://elpais.com/salud-y-bienestar/2025-02-10/turnos-sedentarismo-hiperconexion-estres-como-el-trabajo-nos-roba-el-sueno.html'
    },
    {
      cat: 'Espacios verdes', color: '#4E7A4F', medio: 'La Nación', fecha: '23 ene. 2026',
      titular: 'Plazas, parques y bosques urbanos: la hoja de ruta ambiental desde los vecinos porteños para mitigar las olas de calor',
      bajada: 'Los espacios verdes pueden ayudar a reducir las altas temperaturas y ofrecer lugares para el encuentro y la recreación. La nota recorre propuestas de vecinos de distintos barrios porteños frente a las olas de calor.',
      url: 'https://www.lanacion.com.ar/sociedad/plazas-parques-y-bosques-urbanos-la-hoja-de-ruta-ambiental-desde-los-vecinos-portenos-para-mitigar-nid23012026/'
    },
    {
      cat: 'Acceso a la salud', color: '#2F6B9A', medio: 'La Nación', fecha: '24 feb. 2026',
      titular: 'Ciudad: un nuevo centro gratuito de especialidades médicas acerca servicios cruciales a los vecinos de dos comunas',
      bajada: 'La ubicación de los servicios de salud puede facilitar o dificultar el acceso a la atención. Un nuevo centro acerca distintas especialidades médicas a habitantes de dos comunas de la Ciudad.',
      url: 'https://www.lanacion.com.ar/sociedad/ciudad-un-nuevo-centro-gratuito-de-especialidades-medicas-acerca-servicios-cruciales-a-los-vecinos-nid24022026/'
    },
    {
      cat: 'Enfermedades no transmisibles', color: '#9A4B4B', medio: 'Infobae', fecha: '12 jul. 2025',
      titular: 'El tabaco, la obesidad y el sedentarismo están detrás del aumento de las enfermedades no transmisibles',
      bajada: 'Las enfermedades cardiovasculares, respiratorias, el cáncer y la diabetes representan un importante problema de salud. La nota analiza algunos factores asociados con su aumento y las posibilidades de prevención.',
      url: 'https://www.infobae.com/salud/2025/07/12/el-tabaco-la-obesidad-y-el-sedentarismo-estan-detras-del-aumento-de-las-enfermedades-no-transmisibles/'
    },
    {
      cat: 'Alimentación', color: '#B07A2A', medio: 'El País', fecha: '19 nov. 2025',
      titular: 'La invasión de los ultraprocesados: un centenar de estudios denuncia cómo ‘la industria alimentaria amenaza la salud pública’',
      bajada: 'Los productos ultraprocesados ocupan un lugar cada vez mayor en la alimentación cotidiana. Investigaciones recientes analizan su relación con la salud y el papel que desempeña la industria alimentaria.',
      url: 'https://elpais.com/salud-y-bienestar/2025-11-19/la-invasion-de-los-ultraprocesados-un-centenar-de-estudios-denuncia-como-la-industria-alimentaria-amenaza-la-salud-publica.html'
    },
    {
      cat: 'Barrio y calidad de vida', color: '#3F7F7A', medio: 'El Destape', fecha: '12 nov. 2025',
      titular: 'No es Palermo: este es el mejor barrio de la ciudad de Buenos Aires para vivir, según un estudio',
      bajada: '¿Qué características hacen que un barrio sea considerado un buen lugar para vivir? El estudio compara zonas de Buenos Aires considerando aspectos como espacios verdes, contaminación, transporte y acceso a servicios de salud.',
      url: 'https://www.eldestapeweb.com/sociedad/ciudad-autonoma-buenos-aires/no-es-palermo-este-es-el-mejor-barrio-de-la-ciudad-de-buenos-aires-para-vivir-segun-un-estudio-2025111219245'
    }
  ];

  const track = document.getElementById('track');
  const extIcon = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

  track.innerHTML = noticias.map((n, i) => `
    <article class="card" style="--cat:${n.color}" aria-label="Noticia ${i + 1} de ${noticias.length}">
      <div class="card-meta">
        <span class="card-medio">${n.medio}</span>
        <span class="card-fecha">${n.fecha}</span>
      </div>
      <span class="card-cat">${n.cat}</span>
      <h2 class="card-titular">${n.titular}</h2>
      <p class="card-bajada">${n.bajada}</p>
      <a class="card-link" href="${n.url}" target="_blank" rel="noopener noreferrer">Leer noticia ${extIcon}</a>
    </article>`).join('');

  const cards = track.querySelectorAll('.card');
  const total = cards.length;
  const GAP = 16;
  let current = 0;

  function visible() {
    const w = document.getElementById('viewport').clientWidth;
    if (w >= 820) return 3;
    if (w >= 520) return 2;
    return 1;
  }

  const progress = document.getElementById('progress');

  function layout() {
    const v = visible();
    const w = document.getElementById('viewport').clientWidth - 4;
    const cw = (w - GAP * (v - 1)) / v;
    cards.forEach(c => c.style.width = cw + 'px');
    const max = total - v;
    current = Math.max(0, Math.min(max, current));
    track.style.transform = 'translateX(-' + (current * (cw + GAP)) + 'px)';
    document.getElementById('prev').disabled = current === 0;
    document.getElementById('next').disabled = current >= max;

    const last = current + v;
    document.getElementById('count').textContent =
      v === 1 ? (current + 1) + ' de ' + total : (current + 1) + '–' + last + ' de ' + total;

    progress.innerHTML = '';
    for (let i = 0; i <= max; i++) {
      const d = document.createElement('button');
      d.className = 'dot' + (i === current ? ' on' : '');
      d.setAttribute('aria-label', 'Ir a la posición ' + (i + 1));
      d.onclick = () => { current = i; layout(); };
      progress.appendChild(d);
    }
  }

  function move(dir) { current += dir; layout(); }

  window.addEventListener('resize', layout);
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') move(-1);
    if (e.key === 'ArrowRight') move(1);
  });

  let startX = null;
  track.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
  track.addEventListener('touchend', e => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 40) move(dx < 0 ? 1 : -1);
    startX = null;
  });

  layout();
</script>
</body>
</html>
