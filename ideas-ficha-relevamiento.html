<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ideas para adaptar la ficha al relevamiento</title>
<style>
  :root {
    --azul: #035C80;        /* acento principal */
    --amarillo: #FFCD02;
    --marino: #1D3343;
    --turquesa: #8DE2D6;
    --azul-suave: #EEF4F7;
    --borde: #D5E1E7;
    --tenue: #4A5866;
    --fondo: #F7F9FA;
    --blanco: #FFFFFF;
    --gap: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--fondo);
    color: var(--marino);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }
  body { overflow-x: hidden; }
  button { font: inherit; color: inherit; }

  .app {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 14px 18px 12px;
    height: min(520px, 100vh);
    height: min(520px, 100dvh);
  }

  /* Encabezado */
  .cabecera {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }
  .cabecera h1 {
    margin: 0 0 3px;
    font-size: clamp(19px, 2.4vw, 24px);
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--marino);
  }
  .cabecera h1::before {
    content: "";
    display: block;
    width: 44px; height: 5px;
    border-radius: 3px;
    background: var(--amarillo);
    margin-bottom: 7px;
  }
  .bajada { margin: 0; font-size: 14px; color: var(--tenue); }
  .girar-todas {
    flex: 0 0 auto;
    min-height: 40px;
    padding: 6px 16px;
    border: 0;
    border-radius: 10px;
    background: var(--azul);
    color: var(--blanco);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .girar-todas:hover { background: var(--marino); }
  .girar-todas:focus-visible { outline: 3px solid var(--marino); outline-offset: 2px; }

  /* Grupos de a tres */
  .grilla {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: minmax(150px, 1fr);
    gap: 12px 14px;
    overflow-y: auto;
    padding: 2px;
  }
  .grupo {
    margin: 0;
    padding: 8px;
    list-style: none;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: var(--gap);
    background: var(--azul-suave);
    border: 1px solid var(--borde);
    border-radius: 16px;
  }
  .grupo:nth-child(2), .grupo:nth-child(3) { background: #EAF8F5; border-color: #C9ECE5; }
  .grupo > li { display: flex; min-height: 0; }

  .tarjeta {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    min-height: 132px;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    perspective: 900px;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  .tarjeta:focus { outline: none; }
  .tarjeta:focus-visible .cara { outline: 3px solid var(--marino); outline-offset: 2px; }

  .interior {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform 0.45s ease;
  }
  .tarjeta[aria-pressed="true"] .interior { transform: rotateY(180deg); }

  .cara {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 10px 10px;
    border-radius: 12px;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
  }
  .frente {
    background: var(--blanco);
    border: 1px solid var(--borde);
    box-shadow: 0 1px 2px rgba(29, 51, 67, 0.05);
  }
  .tarjeta:hover .frente { border-color: var(--azul); }
  .icono {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--turquesa);
    display: grid;
    place-items: center;
    color: var(--azul);
  }
  .icono svg {
    width: 25px; height: 25px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .categoria {
    font-size: 15.5px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--marino);
  }
  .dorso {
    transform: rotateY(180deg);
    background: var(--azul);
    border: 1px solid var(--azul);
    gap: 7px;
  }
  .categoria-chica {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.2;
    color: var(--amarillo);
  }
  .pregunta {
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.32;
    color: var(--blanco);
  }

  /* Cierre */
  .cierre {
    flex: 0 0 auto;
    margin: 0;
    padding: 10px 14px;
    border-left: 5px solid var(--amarillo);
    background: var(--blanco);
    border-radius: 0 10px 10px 0;
    font-size: 14.5px;
    color: var(--marino);
  }

  @media (prefers-reduced-motion: reduce) {
    .interior { transition: none; }
  }

  /* Pantallas más angostas: los grupos se apilan */
  @media (max-width: 820px) {
    .grilla { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 600px) {
    .app { padding: 12px 14px 10px; }
    .cabecera { flex-direction: column; align-items: flex-start; gap: 8px; }
    .pregunta { font-size: 13.5px; }
    .categoria { font-size: 14px; }
    .grupo { padding: 6px; --gap: 6px; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="cabecera">
    <div>
      <h1>Ideas para adaptar la ficha al relevamiento</h1>
      <p class="bajada">Son sugerencias, no una lista obligatoria. Toquen cada tarjeta para ver qué conviene registrar.</p>
    </div>
    <button type="button" class="girar-todas" id="girar-todas" aria-pressed="false">Ver todas las preguntas</button>
  </header>

  <div class="grilla" id="grilla" role="list" aria-label="Campos posibles para la ficha"></div>

  <p class="cierre">Estas son algunas ideas. Pueden agregar, modificar o quitar campos según lo que consideren necesario para que la información sea útil para la comunidad.</p>
</main>

<script>
(function () {
  "use strict";

  var ICONOS = {
    nombre: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.4"/>',
    tipo: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',
    ubicacion: '<path d="M12 21.5s7-6.2 7-11.8a7 7 0 1 0-14 0c0 5.6 7 11.8 7 11.8z"/><circle cx="12" cy="9.7" r="2.5"/>',
    distancia: '<circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16"/>',
    servicios: '<path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10"/><path d="M4 6.5l1.2 1.2L7.3 5.5M4 12l1.2 1.2L7.3 11M4 17.5l1.2 1.2 2.1-2.2"/>',
    destinatarios: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14.3a6.5 6.5 0 0 1 3.5 5.7"/>',
    horarios: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/>',
    acceso: '<path d="M14 3h4.5A2.5 2.5 0 0 1 21 5.5v13a2.5 2.5 0 0 1-2.5 2.5H14"/><path d="M10 16.5l4.5-4.5L10 7.5"/><path d="M14.5 12H3"/>',
    costo: '<circle cx="12" cy="12" r="9"/><path d="M14.8 9.4c-.5-.9-1.5-1.4-2.8-1.4-1.6 0-2.8.8-2.8 2s1.2 1.6 2.8 1.9 2.8.8 2.8 2-1.2 2.1-2.8 2.1c-1.3 0-2.4-.5-2.9-1.5M12 6.5V8m0 8.1v1.4"/>',
    contacto: '<path d="M5.5 3.5h3l1.8 4.6-2.2 1.4a11 11 0 0 0 6.4 6.4l1.4-2.2 4.6 1.8v3a2 2 0 0 1-2.1 2A16.5 16.5 0 0 1 3.5 5.6a2 2 0 0 1 2-2.1z"/>',
    fuente: '<path d="M14 3H6.5A2.5 2.5 0 0 0 4 5.5v13A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
    otros: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>'
  };

  // Doce campos, en cuatro grupos de tres
  var CAMPOS = [
    { icono: "nombre",        frente: "Nombre del espacio",      dorso: "¿Cómo se llama?" },
    { icono: "tipo",          frente: "Tipo de espacio",         dorso: "¿Qué clase de espacio o servicio es?" },
    { icono: "ubicacion",     frente: "Ubicación",               dorso: "¿Dónde está?" },
    { icono: "distancia",     frente: "Distancia / recorrido",   dorso: "¿A qué distancia está del CENS? ¿Cómo se llega?" },
    { icono: "servicios",     frente: "Servicios / actividades", dorso: "¿Qué ofrece?" },
    { icono: "destinatarios", frente: "Destinatarios",           dorso: "¿Quiénes pueden acceder o participar?" },
    { icono: "horarios",      frente: "Horarios",                dorso: "¿Cuándo funciona?" },
    { icono: "acceso",        frente: "Acceso",                  dorso: "¿Se necesita turno, inscripción, derivación u otro requisito? ¿Cómo se realiza?" },
    { icono: "costo",         frente: "Costo",                   dorso: "¿Es gratuito? Si no lo es, ¿qué necesitamos saber?" },
    { icono: "contacto",      frente: "Contacto",                dorso: "¿Cómo podemos comunicarnos?" },
    { icono: "fuente",        frente: "Fuente",                  dorso: "¿Dónde obtuvimos estos datos?" },
    { icono: "otros",         frente: "Otros datos",             dorso: "¿Qué otra información podría ser importante para la comunidad?" }
  ];

  var grilla = document.getElementById("grilla");
  var btnTodas = document.getElementById("girar-todas");

  function tarjetaHTML(c, i) {
    return '<li><button type="button" class="tarjeta" aria-pressed="false" id="t' + i + '">' +
      '<span class="interior">' +
        '<span class="cara frente">' +
          '<span class="icono" aria-hidden="true"><svg viewBox="0 0 24 24">' + ICONOS[c.icono] + "</svg></span>" +
          '<span class="categoria">' + c.frente + "</span>" +
        "</span>" +
        '<span class="cara dorso" aria-hidden="true">' +
          '<span class="categoria-chica">' + c.frente + "</span>" +
          '<span class="pregunta">' + c.dorso + "</span>" +
        "</span>" +
      "</span>" +
    "</button></li>";
  }

  var html = "";
  for (var g = 0; g < CAMPOS.length; g += 3) {
    html += '<ul class="grupo" role="listitem">' +
      CAMPOS.slice(g, g + 3).map(function (c, k) { return tarjetaHTML(c, g + k); }).join("") +
      "</ul>";
  }
  grilla.innerHTML = html;

  var tarjetas = Array.prototype.slice.call(grilla.querySelectorAll(".tarjeta"));

  function girar(t, mostrarDorso) {
    t.setAttribute("aria-pressed", String(mostrarDorso));
    t.querySelector(".frente").setAttribute("aria-hidden", String(mostrarDorso));
    t.querySelector(".dorso").setAttribute("aria-hidden", String(!mostrarDorso));
  }

  function actualizarBotonTodas() {
    var todas = tarjetas.every(function (t) { return t.getAttribute("aria-pressed") === "true"; });
    btnTodas.setAttribute("aria-pressed", String(todas));
    btnTodas.textContent = todas ? "Volver a los frentes" : "Ver todas las preguntas";
  }

  tarjetas.forEach(function (t) {
    t.addEventListener("click", function () {
      girar(t, t.getAttribute("aria-pressed") !== "true");
      actualizarBotonTodas();
    });
  });

  btnTodas.addEventListener("click", function () {
    var mostrar = btnTodas.getAttribute("aria-pressed") !== "true";
    tarjetas.forEach(function (t) { girar(t, mostrar); });
    actualizarBotonTodas();
  });
})();
</script>
</body>
</html>
