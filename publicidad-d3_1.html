<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>La publicidad también habla</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #F5F5F0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .carousel-wrap {
      width: 100%;
      max-width: 420px;
      position: relative;
    }

    /* ── Track ── */
    .carousel-track {
      overflow: hidden;
      border-radius: 14px;
    }

    .slides {
      display: flex;
      transition: transform .35s cubic-bezier(.4,0,.2,1);
    }

    .slide {
      min-width: 100%;
      background: #fff;
      border: 1px solid #e0ddd6;
      border-radius: 14px;
      overflow: hidden;
    }

    .slide img {
      width: 100%;
      height: 340px;
      object-fit: cover;
      display: block;
    }

    .slide-body {
      padding: 20px;
    }

    .brand-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 10px;
    }

    .slogan {
      background: #0C2340;
      color: #fff;
      border-radius: 8px;
      padding: 16px 18px;
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-style: italic;
      line-height: 1.35;
      text-align: center;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 18px;
    }

    .btn-nav {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: #0C2340;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .15s;
      flex-shrink: 0;
    }
    .btn-nav:hover { opacity: .8; }
    .btn-nav:disabled { opacity: .25; cursor: default; }

    .dots {
      display: flex;
      gap: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      transition: background .2s, transform .2s;
      cursor: pointer;
      border: none;
    }
    .dot.active {
      background: #0C2340;
      transform: scale(1.3);
    }

    /* ── Counter ── */
    .counter {
      text-align: center;
      font-size: 12px;
      color: #999;
      margin-top: 10px;
      letter-spacing: .05em;
    }
  </style>
</head>

    cur = n;
    slides.style.transform = `translateX(-${cur * 100}%)`;
    document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === cur));
    counter.textContent = `${cur + 1} / ${total}`;
    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === total - 1;
  }

  function move(dir) { goTo(Math.max(0, Math.min(total - 1, cur + dir))); }

  // Touch/swipe
  let startX = 0;
  slides.addEventListener('touchstart', e => startX = e.touches[0].clientX, {passive:true});
  slides.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 40) move(dx < 0 ? 1 : -1);
  });

  goTo(0);
</script>

</body>
</html>
