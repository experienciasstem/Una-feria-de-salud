<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Tenemos información suficiente?</title>
<!--
  CÓMO AGREGAR LAS FOTOGRAFÍAS
  En el script, dentro de CASOS, cada persona tiene un campo  foto: "".
  Completarlo con la ruta o URL de la imagen (por ejemplo  foto: "marina.jpg")
  o con una imagen en base64 (data:image/jpeg;base64,...) para que el archivo
  siga siendo autocontenido. Mientras esté vacío se muestra el recuadro
  "IMAGEN [NOMBRE]". Formato recomendado: cuadrado, mínimo 240 × 240 px.

  Sugerencia para los retratos (mismo estilo para los cinco: luz natural,
  encuadre de hombros hacia arriba, fondo urbano o doméstico sencillo,
  ropa cotidiana, expresión neutra o tranquila, sin texto):
  - Marina: mujer de unos 35 años.
  - Carlos: varón de unos 55 años.
  - Rosa: mujer de unos 60 años.
  - Alicia: mujer de unos 45 años.
  - Diego: varón de unos 25 años.
-->
<style>
  :root {
    --acento: #8DE2D6;
    --acento-suave: #E8F7F4;
    --acento-oscuro: #15655C;
    --tinta: #1F2933;
    --tenue: #4A5562;
    --borde: #D6E0E0;
    --fondo: #F6F8F8;
    --blanco: #FFFFFF;
    --alto-max: 480px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--fondo);
    color: var(--tinta);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  body { overflow-x: hidden; }
  button { font: inherit; }

  .app {
    display: flex;
    flex-direction: column;
    max-width: 1180px;
    margin: 0 auto;
    height: min(var(--alto-max), 100vh);
    height: min(var(--alto-max), 100dvh);
  }

  /* Barra superior */
  .barra {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px 6px;
  }
  .barra .marca {
    width: 6px; height: 22px;
    border-radius: 3px;
    background: var(--acento);
    flex: 0 0 auto;
  }
  .barra h1 { margin: 0; font-size: 17px; font-weight: 700; }

  /* Área central */
  .pantalla {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 18px 6px;
    outline: none;
  }

  /* Navegación inferior */
  .nav {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 8px 18px 10px;
    border-top: 1px solid var(--borde);
    background: var(--fondo);
  }
  .btn {
    min-height: 44px;
    padding: 8px 18px;
    border-radius: 10px;
    border: 1.5px solid var(--acento-oscuro);
    background: var(--blanco);
    color: var(--acento-oscuro);
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover:not(:disabled) { background: var(--acento-suave); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn-primario { background: var(--acento); border-color: var(--acento); color: var(--tinta); }
  .btn-primario:hover:not(:disabled) { background: #7AD6C9; }
  .btn:focus-visible, .punto:focus-visible, .chip:focus-visible, .opcion:focus-visible {
    outline: 3px solid var(--tinta);
    outline-offset: 2px;
  }
  .indicador {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-width: 0;
  }
  .indicador-texto { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .puntos { display: flex; gap: 4px; }
  .punto {
    width: 28px; height: 28px;
    padding: 0;
    border: 0;
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .punto::before {
    content: "";
    width: 10px; height: 10px;
    border-radius: 50%;
    border: 2px solid var(--acento-oscuro);
    background: var(--blanco);
  }
  .punto[aria-current="step"]::before { background: var(--acento-oscuro); }

  /* ---------- Portada ---------- */
  /* En la portada la barra superior se oculta visualmente (sigue siendo el h1
     para lectores de pantalla) y el título se muestra grande. */
  .app.en-portada .barra {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); padding: 0; margin: -1px;
  }
  .app.en-portada .pantalla { padding-top: 18px; }
  .intro {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
  }
  .portada-cabecera {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
    gap: 28px;
    align-items: end;
  }
  .portada-titulo {
    margin: 0;
    font-size: clamp(26px, 3.6vw, 36px);
    line-height: 1.1;
    letter-spacing: -0.015em;
    font-weight: 800;
  }
  .portada-titulo::before {
    content: "";
    display: block;
    width: 48px; height: 6px;
    border-radius: 3px;
    background: var(--acento);
    margin-bottom: 12px;
  }
  .portada-texto .lead { margin: 0 0 6px; font-size: 16px; color: var(--tenue); }
  .portada-texto .pregunta-intro {
    margin: 0;
    font-size: clamp(17px, 1.9vw, 19px);
    font-weight: 700;
    line-height: 1.35;
  }
  .chips {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 12px;
  }
  .chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 10px 12px;
    width: 100%;
    border: 2px solid var(--c-fuerte, var(--borde));
    border-radius: 14px;
    background: var(--c-suave, var(--blanco));
    color: var(--tinta);
    cursor: pointer;
    text-align: center;
    line-height: 1.2;
  }
  .chip:hover { filter: brightness(0.97); }
  .chip .foto { width: 84px; height: 84px; border-radius: 50%; background: rgba(255,255,255,0.6); }
  .chip .foto.vacia { font-size: 10px; border-color: var(--c-fuerte); }
  .chip strong { display: block; font-size: 17px; color: var(--c-fuerte, var(--tinta)); }
  .chip span { display: block; font-size: 13px; color: var(--tinta); margin-top: 2px; }
  @media (max-width: 760px) {
    .portada-cabecera { grid-template-columns: minmax(0, 1fr); gap: 10px; }
    .chips { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
  @media (max-width: 460px) {
    .chip { flex-direction: row; text-align: left; padding: 8px 10px; }
    .chip .foto { width: 44px; height: 44px; }
    .chip .foto.vacia { font-size: 0; }
    .chips { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  }

  /* ---------- Caso ---------- */
  .caso {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ficha {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 22px;
    align-items: start;
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 10px 18px 12px;
  }
  .ficha-b { padding-top: 4px; }
  /* En pantallas apaisadas el caso ocupa todo el alto disponible:
     la ficha se estira y la decisión queda abajo, sin espacio vacío. */
  @media (min-width: 861px) {
    .caso { min-height: 100%; }
    .caso .foto { width: 78px; height: 78px; }
    .ficha { flex: 1 1 auto; align-content: center; }
  }
  .persona { display: flex; gap: 14px; align-items: center; margin-bottom: 6px; }
  .foto {
    flex: 0 0 auto;
    width: 64px; height: 64px;
    border-radius: 12px;
    overflow: hidden;
    background: #E9EEEE;
  }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto.vacia {
    display: grid;
    place-items: center;
    border: 1.5px dashed #9AA5AE;
    text-align: center;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--tenue);
    line-height: 1.25;
    padding: 4px;
  }
  .persona h2 { margin: 0; font-size: 24px; line-height: 1.1; color: var(--c-fuerte, var(--tinta)); }
  .barrio { margin: 3px 0 0; font-size: 14px; color: var(--tenue); }
  .situacion {
    margin: 0;
    font-size: 17px;
    line-height: 1.45;
  }
  .etiqueta {
    margin: 0 0 3px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--tenue);
  }
  .recurso {
    padding: 9px 12px;
    border-radius: 10px;
    background: var(--c-suave, var(--fondo));
    margin-bottom: 8px;
  }
  .recurso p:last-child { margin: 0; font-weight: 600; font-size: 15px; line-height: 1.35; }
  .recurso .etiqueta { color: var(--c-fuerte, var(--tenue)); }
  .disponible { padding: 0 2px; }
  .disponible li { color: var(--c-fuerte, var(--tinta)); }
  .disponible li::before { background: var(--c-fuerte, var(--acento-oscuro)) !important; }
  .pistas li::before { border-color: var(--c-fuerte, var(--acento-oscuro)) !important; }
  .disponible ul { margin: 0; padding: 0; list-style: none; }
  .disponible li {
    position: relative;
    padding-left: 18px;
    margin-bottom: 2px;
    font-size: 14.5px;
    line-height: 1.4;
  }
  .disponible li::before {
    content: "";
    position: absolute;
    left: 2px; top: 0.45em;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--acento-oscuro);
  }

  .decision {
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: 14px;
    padding: 8px 18px;
  }
  .decision-fila {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 20px;
  }
  .pregunta { flex: 1 1 320px; margin: 0; font-weight: 700; font-size: 16.5px; line-height: 1.35; }
  .opciones { flex: 0 1 auto; display: flex; flex-wrap: wrap; gap: 10px; }
  .opcion {
    flex: 1 1 auto;
    min-width: 150px;
    min-height: 44px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1.5px solid var(--acento-oscuro);
    background: var(--blanco);
    color: var(--acento-oscuro);
    font-weight: 600;
    cursor: pointer;
  }
  .opcion:hover { background: var(--acento-suave); }
  .opcion[aria-pressed="true"] { background: var(--acento); color: var(--tinta); }

  .respuesta:empty { display: none; }
  .respuesta { margin-top: 8px; }
  .reflexion {
    padding: 8px 12px;
    border-left: 4px solid var(--acento);
    background: var(--fondo);
    border-radius: 0 10px 10px 0;
  }
  .reflexion {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
  }
  .reflexion > p {
    margin: 0;
    font-weight: 600;
    font-size: 15px;
    outline: none;
  }
  .reflexion.abierta { display: block; }
  .reflexion.abierta > p { margin-bottom: 6px; }
  .reflexion .btn { min-height: 40px; padding: 6px 14px; font-size: 14.5px; }
  .pistas { margin: 0; padding: 0; list-style: none; columns: 3 220px; column-gap: 24px; }
  .pistas li { break-inside: avoid; }
  .pistas li {
    position: relative;
    padding-left: 18px;
    margin-bottom: 2px;
    font-size: 14.5px;
    line-height: 1.4;
  }
  .pistas li::before {
    content: "";
    position: absolute;
    left: 2px; top: 0.45em;
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 2px solid var(--acento-oscuro);
    box-sizing: border-box;
  }
  .revisar {
    margin: 0;
    padding: 10px 12px;
    border-left: 4px solid var(--acento);
    background: var(--fondo);
    border-radius: 0 10px 10px 0;
    font-size: 15px;
  }

  /* ---------- Comparación final ---------- */
  .comparacion {
    display: grid;
    grid-template-columns: minmax(260px, 38%) minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }
  .comparacion h2 { margin: 0 0 8px; font-size: 22px; line-height: 1.2; }
  .comparacion .texto { margin: 0 0 10px; font-size: 15px; }
  .consigna {
    margin: 0 0 14px;
    padding: 10px 12px;
    border-left: 5px solid var(--acento);
    background: var(--blanco);
    border-radius: 0 8px 8px 0;
    font-weight: 700;
  }
  .otro-dato {
    margin: 0;
    padding: 10px 12px;
    background: var(--acento-suave);
    border: 1.5px solid var(--acento);
    border-radius: 10px;
    font-weight: 700;
    outline: none;
  }
  .resumen-casos { margin: 0; padding: 0; list-style: none; }
  .resumen-casos li {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 10px;
    padding: 8px 12px;
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: 10px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .categorias {
    margin: 0 0 10px; padding: 0; list-style: none;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }
  .categoria {
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-top: 4px solid var(--acento);
    border-radius: 10px;
    padding: 8px 12px 10px;
  }
  .categoria h3 {
    margin: 0 0 2px;
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--acento-oscuro);
  }
  .categoria p { margin: 0; font-size: 14px; line-height: 1.35; }

  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  /* ---------- Pantallas más chicas ---------- */
  @media (max-width: 860px) {
    .ficha, .comparacion { grid-template-columns: minmax(0, 1fr); }
    .ficha { gap: 10px; }
    .ficha-b { padding-top: 0; }
    .categorias { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    html, body { font-size: 14.5px; }
    .barra { padding: 8px 14px 6px; }
    .barra h1 { font-size: 15.5px; }
    .pantalla { padding: 4px 14px 10px; }
    .nav { padding: 8px 14px; gap: 8px; }
    .btn { padding: 8px 12px; }
    .foto { width: 60px; height: 60px; }
    .persona h2 { font-size: 21px; }
    .situacion { font-size: 16px; }
    .categorias { grid-template-columns: minmax(0, 1fr); }
    .intro { justify-content: flex-start; }
  }
  @media (max-width: 460px) {
    .puntos { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="barra">
    <span class="marca" aria-hidden="true"></span>
    <h1>¿Tenemos información suficiente?</h1>
  </header>

  <main id="pantalla" class="pantalla" tabindex="-1"></main>

  <nav class="nav" aria-label="Navegación del recurso">
    <button type="button" class="btn" id="anterior">Anterior</button>
    <div class="indicador">
      <span class="indicador-texto" id="indicador-texto"></span>
      <div class="puntos" id="puntos"></div>
    </div>
    <button type="button" class="btn btn-primario" id="siguiente">Siguiente</button>
  </nav>

  <p class="sr-only" id="anuncio" aria-live="polite"></p>
</div>

      barrio: "Flores",
      orientar: "orientarlo",
      situacion: "Está atravesando una situación personal que le genera mucho malestar y quiere encontrar un espacio donde pueda hablar con alguien y recibir orientación o acompañamiento.",

  // Pantallas: 0 introducción · 1 a 5 casos
  var TOTAL = 6;
  var actual = 0;
  var decisiones = {};     // caso -> "si" | "no"
  var pistasVistas = {};   // caso -> true

  var pantalla = document.getElementById("pantalla");
  var btnAnterior = document.getElementById("anterior");
  var btnSiguiente = document.getElementById("siguiente");
  var indTexto = document.getElementById("indicador-texto");
  var puntos = document.getElementById("puntos");
  var anuncio = document.getElementById("anuncio");

  function esc(t) {
    return String(t).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function fotoHTML(c) {
    if (c.foto) {
      return '<div class="foto"><img src="' + esc(c.foto) + '" alt="Retrato de ' + esc(c.nombre) + '"></div>';
    }
    return '<div class="foto vacia" role="img" aria-label="Espacio para la imagen de ' + esc(c.nombre) + '">IMAGEN<br>' + esc(c.nombre.toUpperCase()) + "</div>";
  }

  function lista(items, clase) {
    return '<ul class="' + (clase || "") + '">' + items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul>";
  }

  // ---------- Pantallas ----------
  function introHTML() {
    var chips = CASOS.map(function (c, i) {
      return '<button type="button" class="chip" style="--c-suave:' + c.colorSuave + ";--c-fuerte:" + c.colorFuerte + '" data-ir="' + (i + 1) + '" aria-label="Caso ' + (i + 1) + ": " + esc(c.nombre) + ", " + esc(c.barrio) + '">' +
        fotoHTML(c) + "<div><strong>" + esc(c.nombre) + "</strong><span>" + esc(c.barrio) + "</span></div></button>";
    }).join("");
    return '<section class="intro" aria-label="Introducción">' +
      '<div class="portada-cabecera">' +
        '<p class="portada-titulo" aria-hidden="true">¿Tenemos información suficiente?</p>' +
        '<div class="portada-texto">' +
          '<p class="lead">Recorran los cinco casos y analicen la información disponible.</p>' +
          '<p class="pregunta-intro">¿Alcanza para saber si cada espacio puede responder a lo que necesita esa persona?</p>' +
        "</div>" +
      "</div>" +
      '<div class="chips">' + chips + "</div>" +
      "</section>";
  }

  function casoHTML(n) {
    var c = CASOS[n - 1];
    var id = "caso" + n;
    var d = decisiones[n];
    return '<article class="caso" style="--c-suave:' + c.colorSuave + ";--c-fuerte:" + c.colorFuerte + '" aria-labelledby="' + id + '-nombre">' +
      '<div class="ficha">' +
        '<div class="ficha-a">' +
        '<div class="persona">' + fotoHTML(c) +
          "<div>" +
            '<h2 id="' + id + '-nombre">' + esc(c.nombre) + "</h2>" +
            '<p class="barrio">Vive en ' + esc(c.barrio) + ".</p>" +
          "</div>" +
        "</div>" +
        '<p class="situacion">' + esc(c.situacion) + "</p>" +
        "</div>" +
        '<div class="ficha-b">' +
        '<div class="recurso"><p class="etiqueta">Espacio encontrado</p><p>' + esc(c.recurso) + "</p></div>" +
        '<section class="disponible" aria-labelledby="' + id + '-disp">' +
          '<p class="etiqueta" id="' + id + '-disp">Información disponible</p>' +
          lista(c.disponible) +
        "</section>" +
        "</div>" +
      "</div>" +
      '<div class="decision">' +
        '<div class="decision-fila">' +
        '<p class="pregunta" id="' + id + '-preg">¿Con esta información alcanza para saber si este espacio puede ayudar a ' + esc(c.nombre) + "?</p>" +
        '<div class="opciones" role="group" aria-labelledby="' + id + '-preg">' +
          '<button type="button" class="opcion" data-decision="si" aria-pressed="' + (d === "si") + '">Sí, alcanza</button>' +
          '<button type="button" class="opcion" data-decision="no" aria-pressed="' + (d === "no") + '">No, necesitamos saber más</button>' +
        "</div>" +
        "</div>" +
        '<div class="respuesta" id="' + id + '-resp" aria-live="polite">' + respuestaHTML(n) + "</div>" +
      "</div>" +
    "</article>";
  }

  function respuestaHTML(n) {
    var c = CASOS[n - 1];
    var id = "caso" + n;
    if (decisiones[n] === "si") {
      return '<p class="revisar">Revisen la información disponible. ' + esc(c.revisar) + "</p>";
    }
    if (decisiones[n] === "no") {
      var contenido = pistasVistas[n]
        ? lista(c.pistas, "pistas")
        : '<button type="button" class="btn" data-pistas="' + n + '">Ver qué podríamos averiguar</button>';
      return '<div class="reflexion' + (pistasVistas[n] ? " abierta" : "") + '">' +
        '<p id="' + id + '-refl" tabindex="-1">¿Qué información faltaría averiguar antes de poder ' + esc(c.orientar) + "?</p>" +
        contenido +
      "</div>";
    }
    return "";
  }

  // ---------- Navegación ----------
  function etiqueta(i) {
    if (i === 0) return "Inicio";
    return "Caso " + i + " de 5";
  }

  function construirPuntos() {
    puntos.innerHTML = CASOS.map(function (c, i) {
      return '<button type="button" class="punto" data-ir="' + (i + 1) + '" aria-label="Caso ' + (i + 1) + " de 5: " + esc(c.nombre) + '"></button>';
    }).join("");
  }

  function render() {
    document.querySelector(".app").classList.toggle("en-portada", actual === 0);
    if (actual === 0) pantalla.innerHTML = introHTML();
    else pantalla.innerHTML = casoHTML(actual);

    indTexto.textContent = etiqueta(actual);
    Array.prototype.forEach.call(puntos.children, function (p, i) {
      if (i + 1 === actual) p.setAttribute("aria-current", "step");
      else p.removeAttribute("aria-current");
    });
    btnAnterior.disabled = actual === 0;
    btnSiguiente.disabled = actual === TOTAL - 1;
    btnSiguiente.textContent = actual === 0 ? "Comenzar" : "Siguiente";
    pantalla.scrollTop = 0;
  }

  function ir(i, moverFoco) {
    if (i < 0 || i >= TOTAL || i === actual) return;
    actual = i;
    render();
    var nombre = (actual >= 1 && actual <= 5) ? ": " + CASOS[actual - 1].nombre : "";
    anuncio.textContent = etiqueta(actual) + nombre;
    if (moverFoco) pantalla.focus({ preventScroll: true });
    if (document.activeElement === btnSiguiente && btnSiguiente.disabled) btnAnterior.focus();
    if (document.activeElement === btnAnterior && btnAnterior.disabled) btnSiguiente.focus();
  }

  function actualizarRespuesta(n) {
    var resp = document.getElementById("caso" + n + "-resp");
    resp.innerHTML = respuestaHTML(n);
    if (resp.scrollIntoView) resp.scrollIntoView({ block: "nearest" });
  }

  btnAnterior.addEventListener("click", function () { ir(actual - 1); });
  btnSiguiente.addEventListener("click", function () { ir(actual + 1); });

  puntos.addEventListener("click", function (e) {
    var b = e.target.closest("[data-ir]");
    if (b) ir(Number(b.getAttribute("data-ir")));
  });

  pantalla.addEventListener("click", function (e) {
    var irA = e.target.closest("[data-ir]");
    if (irA) { ir(Number(irA.getAttribute("data-ir")), true); return; }

    var opcion = e.target.closest(".opcion");
    if (opcion) {
      decisiones[actual] = opcion.getAttribute("data-decision");
      Array.prototype.forEach.call(pantalla.querySelectorAll(".opcion"), function (b) {
        b.setAttribute("aria-pressed", String(b === opcion));
      });
      actualizarRespuesta(actual);
      return;
    }

    var verPistas = e.target.closest("[data-pistas]");
    if (verPistas) {
      pistasVistas[actual] = true;
      actualizarRespuesta(actual);
      var refl = document.getElementById("caso" + actual + "-refl");
      if (refl) refl.focus();
      return;
    }

  });

  // Flechas izquierda/derecha para pasar de pantalla
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    if (e.key === "ArrowRight") ir(actual + 1);
    else if (e.key === "ArrowLeft") ir(actual - 1);
  });

  construirPuntos();
  render();
})();
</script>
</body>
</html>
